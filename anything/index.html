
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HTML Preview</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
      color: #222;
    }

    textarea {
      box-sizing: border-box;
      width: 100%;
      height: 300px;
      padding: 12px;
      font: 14px monospace;
      border: 1px solid #ccc;
      border-radius: 6px;
      resize: vertical;
    }

    button {
      margin-top: 12px;
      padding: 10px 18px;
      border: 0;
      border-radius: 6px;
      background: #222;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #444;
    }
  </style>
</head>
<body>
  <h2>HTML Preview</h2>
  <p>Enter your HTML below and open it in a new tab.</p>

  <textarea id="html" placeholder="Type your HTML here..."><h1>Hello, world!</h1>
<p>This page was opened from a Blob URL.</p></textarea>

  <br>
  <button onclick="openPreview()">Open Preview</button>

  <script>
    function openPreview() {
      const html = document.getElementById("html").value;

      const blob = new Blob(
        [html],
        { type: "text/html" }
      );

      const url = URL.createObjectURL(blob);
      window.open(url, "_blank");
    }
  </script>
</body>
</html>
