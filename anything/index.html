<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HTML Replacer</title>
</head>
<body>
  <textarea id="html" placeholder="Enter complete HTML here…" spellcheck="false"
    style="box-sizing:border-box;width:100%;height:70vh;"></textarea>
  <button id="replace" type="button">Replace page with HTML</button>

  <script>
    document.getElementById("replace").addEventListener("click", function () {
      const html = document.getElementById("html").value;
      document.open();
      document.write(html);
      document.close();
    });
  </script>
</body>
</html>
