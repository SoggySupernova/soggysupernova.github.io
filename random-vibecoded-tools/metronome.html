<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Hello, world!</title>
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <meta name="description" content="" />
        <link rel="icon" href="favicon.png">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
        <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    </head>


<script src="https://unpkg.com/lucide@latest"></script>
        <style>
            html {
                background-color: #000010;
                color: white;
                font-family: "Inter", sans-serif;
            }
            * {
                font-family: "Inter", sans-serif;
            }
            #ooh-color {
                color: transparent;
                background: linear-gradient(to right, rgb(59, 59, 209), rgb(187, 20, 248));
                background-clip: text;
            }
            small {
                font-size: 10px;
            }
            #start-button {
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                width: 18vh;
                height: 18vh;
                background-color: rgb(82, 189, 49);
                border-radius: 100900000px; /* worst possible way to make a circle */
                display: flex;
                align-items: center;
                justify-content: center;
                cursor: pointer;
            }
            #stop-button {
                position: absolute;
                top: 50%;
                left: calc(50% + 16vh);
                transform: translate(-50%, -50%);
                width: 10vh;
                height: 10vh;
                background-color: rgb(200, 76, 60);
                border-radius: 100900000px; /* worst possible way to make a circle */
                display: flex;
                align-items: center;
                justify-content: center;
                cursor: pointer;
            }
            #start-button .lucide {
                width: 4vh;
                height: 4vh; /* gotta keep things responsive */
            }
            #stop-button .lucide {
                width: 3.6vh;
                height: 3.6vh;
            }
            #bpm {
                position: absolute;
                top: calc(50% + 15vh);
                left: 50%;
                transform: translate(-50%, -50%);
                background-color: rgb(18, 4, 40);
                border: none;
                padding: 5px;
                border-radius: 1000px;
                width: 10vh;
                height: 5vh;
                color: white;
                text-align: center;
            }
            #bpm::placeholder {
                color: rgb(82, 50, 105);
            }
            #bpm::-webkit-inner-spin-button {
                display: none;
            }
        </style>
    </head>
    <body>
        <h4><span id="ooh-color">metronome</span><small>&nbsp;&nbsp;by SoggySupernova</small></h4>
        <div id="start-button"><i data-lucide="play"></i></div>
        <div id="stop-button"><i data-lucide="pause"></i></div>
        <input type="number" placeholder="bpm" id="bpm" value="120"/>
        <script>
            lucide.createIcons(); // this is not recommended but I don't care
        </script>
        <script>
let audioContext;
let buffer;
let timer;

async function loadSound(url) {
  audioContext = audioContext || new (window.AudioContext || window.webkitAudioContext)();
  const response = await fetch(url);
  const arrayBuffer = await response.arrayBuffer();
  buffer = await audioContext.decodeAudioData(arrayBuffer);
}

function playSound() {
  timer = setTimeout(playSound, Math.max(isFinite(60000 / document.querySelector("#bpm").value) ? (60000 / document.querySelector("#bpm").value) : 999999999,20));
  const source = audioContext.createBufferSource();
  source.buffer = buffer;
  source.connect(audioContext.destination);
  source.start();
}

document.getElementById("start-button").addEventListener("click", async () => {
  if (!audioContext) {
    await loadSound("click.mp3");
  }
  await audioContext.resume();
  if (timer) return;

  playSound();
});

document.getElementById("stop-button").addEventListener("click", () => {
  clearInterval(timer);
  timer = null;
});

document.querySelector("#bpm").oninput = function() {


        const highestId = window.setTimeout(() => {
        for (let i = highestId; i >= 0; i--) {
            window.clearInterval(i);
        }
            }, 0);

    playSound()
};
</script>
    </body>
</html>
