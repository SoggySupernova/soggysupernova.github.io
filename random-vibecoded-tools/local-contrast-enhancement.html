<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Local Contrast Enhancement</title>
<style>
  body {
    font-family: system-ui, sans-serif;
    margin: 20px;
    background: #f5f5f5;
  }
  canvas {
    border: 1px solid #999;
    max-width: 100%;
  }
  .controls {
    margin: 10px 0;
  }
  label {
    display: block;
    margin-top: 8px;
  }
</style>
</head>
<body>

<h2>Local Contrast Enhancement (Unsharp Mask)</h2>

<input type="file" id="imageInput" accept="image/*">

<div class="controls">
  <label>
    Blur Radius:
    <input type="range" id="radius" min="1" max="30" value="5">
    <span id="radiusVal">5</span>
  </label>

  <label>
    Strength:
    <input type="range" id="amount" min="0" max="3" step="0.1" value="1.0">
    <span id="amountVal">1.0</span>
  </label>
</div>

<canvas id="canvas"></canvas>

<script>
const input = document.getElementById("imageInput");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const radiusSlider = document.getElementById("radius");
const amountSlider = document.getElementById("amount");
const radiusVal = document.getElementById("radiusVal");
const amountVal = document.getElementById("amountVal");

let originalImageData = null;

radiusSlider.oninput = () => {
  radiusVal.textContent = radiusSlider.value;
  if (originalImageData) enhance();
};

amountSlider.oninput = () => {
  amountVal.textContent = amountSlider.value;
  if (originalImageData) enhance();
};

input.onchange = e => {
  const img = new Image();
  img.onload = () => {
    canvas.width = img.width;
    canvas.height = img.height;
    ctx.drawImage(img, 0, 0);
    originalImageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    enhance();
  };
  img.src = URL.createObjectURL(e.target.files[0]);
};

function enhance() {
  const radius = parseInt(radiusSlider.value);
  const amount = parseFloat(amountSlider.value);

  const src = originalImageData;
  const blurred = gaussianBlur(src, radius);
  const dst = ctx.createImageData(src.width, src.height);

  for (let i = 0; i < src.data.length; i += 4) {
    for (let c = 0; c < 3; c++) {
      const o = src.data[i + c];
      const b = blurred.data[i + c];
      let v = o + amount * (o - b);
      dst.data[i + c] = Math.max(0, Math.min(255, v));
    }
    dst.data[i + 3] = 255;
  }

  ctx.putImageData(dst, 0, 0);
}

function gaussianBlur(imageData, radius) {
  const { width, height, data } = imageData;
  const tmp = new Uint8ClampedArray(data);
  const out = new Uint8ClampedArray(data);
  const kernel = gaussianKernel(radius);

  // Horizontal pass
  for (let y = 0; y < height; y++) {
    for (let x = 0; x < width; x++) {
      for (let c = 0; c < 3; c++) {
        let sum = 0;
        let wsum = 0;
        for (let k = -radius; k <= radius; k++) {
          const ix = Math.min(width - 1, Math.max(0, x + k));
          const w = kernel[k + radius];
          sum += data[(y * width + ix) * 4 + c] * w;
          wsum += w;
        }
        tmp[(y * width + x) * 4 + c] = sum / wsum;
      }
    }
  }

  // Vertical pass
  for (let y = 0; y < height; y++) {
    for (let x = 0; x < width; x++) {
      for (let c = 0; c < 3; c++) {
        let sum = 0;
        let wsum = 0;
        for (let k = -radius; k <= radius; k++) {
          const iy = Math.min(height - 1, Math.max(0, y + k));
          const w = kernel[k + radius];
          sum += tmp[(iy * width + x) * 4 + c] * w;
          wsum += w;
        }
        out[(y * width + x) * 4 + c] = sum / wsum;
      }
      out[(y * width + x) * 4 + 3] = 255;
    }
  }

  return new ImageData(out, width, height);
}

function gaussianKernel(radius) {
  const sigma = radius / 3;
  const size = radius * 2 + 1;
  const kernel = new Float32Array(size);
  let sum = 0;

  for (let i = 0; i < size; i++) {
    const x = i - radius;
    const v = Math.exp(-(x * x) / (2 * sigma * sigma));
    kernel[i] = v;
    sum += v;
  }

  for (let i = 0; i < size; i++) kernel[i] /= sum;
  return kernel;
}
</script>

</body>
</html>
