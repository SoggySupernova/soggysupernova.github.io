<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" href="https://cdn.simplecss.org/simple.min.css">
	<style>
		:root {--accent: #63a6d3;}
	</style>
  <title>AutoLongRedditStories Docs</title>
  </head>
  <body>
		<a href="#" style="position:fixed;top:8px;right:10px;">Top</a>
    <header>
      <h1>
        AutoLongRedditStories Docs (Under Construction)
      </h1>
    </header>
    <main>
      <details>
        <summary>Contents</summary>
        <ul id="contents">
        </ul>					
      </details>
			<section>
				<h3 class="listItem" id="test1">Test 1</h3>
				<p>sample text</p>
			</section>
			<section>
				<h3 class="listItem" id="test2">Test 2</h3>
        <p>Lorem ipsum dolor sit amet</p>
			</section>
    </main>
    <footer>
      
        Made with Simple.css
      
    </footer>
		<script>
			// Automatically generate table of contents
			const elements = document.getElementsByClassName('listItem');
			for (let i = 0; i < elements.length; i++) {	
  			const element = elements[i];
  			document.querySelector('#contents').innerHTML += `<li><a href="#${element.getAttribute('id')}">${element.textContent}</a></li>`;
			}
	</script>
  </body>
</html>
