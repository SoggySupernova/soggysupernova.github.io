<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OBJ → Triangle Arrays</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap');

  :root {
    --bg: #0a0a0f;
    --surface: #11111a;
    --border: #1e1e30;
    --accent: #00ffb2;
    --accent2: #ff4d6d;
    --accent3: #7b61ff;
    --text: #e8e8f0;
    --muted: #555570;
    --code-bg: #0d0d18;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px 60px;
    position: relative;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    top: -200px; left: -200px;
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(0,255,178,0.04) 0%, transparent 70%);
    pointer-events: none;
  }
  body::after {
    content: '';
    position: fixed;
    bottom: -200px; right: -200px;
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(123,97,255,0.05) 0%, transparent 70%);
    pointer-events: none;
  }

  header {
    text-align: center;
    margin-bottom: 40px;
  }

  .title-eyebrow {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 4px;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 12px;
    opacity: 0.8;
  }

  h1 {
    font-size: clamp(28px, 5vw, 48px);
    font-weight: 800;
    letter-spacing: -1px;
    line-height: 1.1;
    background: linear-gradient(135deg, #fff 30%, var(--accent) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .subtitle {
    margin-top: 10px;
    color: var(--muted);
    font-size: 14px;
    font-family: 'Space Mono', monospace;
    letter-spacing: 0.5px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px;
    width: 100%;
    max-width: 820px;
    margin-bottom: 20px;
  }

  .card-label {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--accent3);
    margin-bottom: 14px;
  }

  /* Drop zone */
  #dropzone {
    border: 2px dashed var(--border);
    border-radius: 12px;
    padding: 48px 24px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s ease;
    position: relative;
    background: var(--code-bg);
  }
  #dropzone:hover, #dropzone.dragover {
    border-color: var(--accent);
    background: rgba(0,255,178,0.03);
  }
  #dropzone.dragover { transform: scale(1.01); }

  .drop-icon {
    font-size: 40px;
    margin-bottom: 14px;
    display: block;
    filter: grayscale(0.3);
  }

  .drop-main {
    font-size: 17px;
    font-weight: 700;
    margin-bottom: 6px;
  }
  .drop-sub {
    font-size: 13px;
    color: var(--muted);
    font-family: 'Space Mono', monospace;
  }

  #file-input { display: none; }

  .btn {
    display: inline-block;
    margin-top: 16px;
    padding: 10px 22px;
    background: transparent;
    border: 1px solid var(--accent);
    color: var(--accent);
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn:hover {
    background: var(--accent);
    color: var(--bg);
  }
  .btn-copy {
    border-color: var(--accent3);
    color: var(--accent3);
    padding: 7px 16px;
    font-size: 10px;
    margin-top: 0;
  }
  .btn-copy:hover { background: var(--accent3); color: #fff; }
  .btn-copy.copied { border-color: var(--accent); color: var(--accent); }

  /* Stats bar */
  #stats-bar {
    display: none;
    gap: 24px;
    flex-wrap: wrap;
    margin-top: 18px;
  }
  #stats-bar.visible { display: flex; }
  .stat {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .stat-value {
    font-size: 22px;
    font-weight: 800;
    color: var(--accent);
    line-height: 1;
  }
  .stat-label {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--muted);
    text-transform: uppercase;
  }

  /* Output sections */
  .output-sections { display: none; width: 100%; max-width: 820px; }
  .output-sections.visible { display: block; }

  .output-block {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    margin-bottom: 16px;
    overflow: hidden;
  }

  .output-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    background: rgba(255,255,255,0.02);
  }

  .output-title {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .vertex-badge {
    width: 22px; height: 22px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    font-weight: 700;
  }
  .v1 { background: rgba(0,255,178,0.15); color: var(--accent); border: 1px solid rgba(0,255,178,0.3); }
  .v2 { background: rgba(255,77,109,0.15); color: var(--accent2); border: 1px solid rgba(255,77,109,0.3); }
  .v3 { background: rgba(123,97,255,0.15); color: var(--accent3); border: 1px solid rgba(123,97,255,0.3); }

  .output-name {
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.3px;
  }
  .v1-text { color: var(--accent); }
  .v2-text { color: var(--accent2); }
  .v3-text { color: var(--accent3); }

  .output-meta {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--muted);
  }

  .output-actions { display: flex; gap: 8px; align-items: center; }

  textarea.output-area {
    width: 100%;
    background: var(--code-bg);
    border: none;
    color: #a8f5d8;
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    line-height: 1.7;
    padding: 18px 20px;
    resize: vertical;
    min-height: 130px;
    max-height: 300px;
    outline: none;
    tab-size: 2;
  }

  /* Error */
  #error-msg {
    display: none;
    padding: 14px 18px;
    background: rgba(255,77,109,0.08);
    border: 1px solid rgba(255,77,109,0.3);
    border-radius: 10px;
    color: var(--accent2);
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    margin-top: 14px;
  }
  #error-msg.visible { display: block; }

  /* Divider */
  .divider {
    width: 1px;
    height: 20px;
    background: var(--border);
  }

  .file-name-tag {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--accent);
    background: rgba(0,255,178,0.08);
    border: 1px solid rgba(0,255,178,0.2);
    border-radius: 4px;
    padding: 3px 8px;
    margin-left: 10px;
  }
</style>
</head>
<body>

<header>
  <div class="title-eyebrow">3D Mesh Tool</div>
  <h1>OBJ → Triangle Arrays</h1>
  <p class="subtitle">// extract v1, v2, v3 per triangle face</p>
</header>

<!-- Upload Card -->
<div class="card">
  <div class="card-label">// Input</div>
  <div id="dropzone">
    <span class="drop-icon">⬡</span>
    <div class="drop-main">Drop your .obj file here</div>
    <div class="drop-sub">Triangulated or quad mesh — faces are auto-triangulated</div>
    <button class="btn" onclick="document.getElementById('file-input').click()">Browse file</button>
    <input type="file" id="file-input" accept=".obj">
  </div>

  <div id="stats-bar">
    <div class="stat">
      <span class="stat-value" id="stat-verts">—</span>
      <span class="stat-label">Vertices</span>
    </div>
    <div class="divider" style="width:1px;height:40px;background:var(--border);align-self:center"></div>
    <div class="stat">
      <span class="stat-value" id="stat-faces">—</span>
      <span class="stat-label">Faces (raw)</span>
    </div>
    <div class="divider" style="width:1px;height:40px;background:var(--border);align-self:center"></div>
    <div class="stat">
      <span class="stat-value" id="stat-tris">—</span>
      <span class="stat-label">Triangles</span>
    </div>
  </div>

  <div id="error-msg"></div>
</div>

<!-- Output Blocks -->
<div class="output-sections" id="output-sections">
  <!-- V1 -->
  <div class="output-block">
    <div class="output-header">
      <div class="output-title">
        <div class="vertex-badge v1">1</div>
        <span class="output-name v1-text">First Vertex</span>
        <span class="output-meta" id="meta-v1"></span>
      </div>
      <div class="output-actions">
        <button class="btn btn-copy" onclick="copyOutput('out-v1', this)">Copy</button>
      </div>
    </div>
    <textarea class="output-area" id="out-v1" readonly></textarea>
  </div>

  <!-- V2 -->
  <div class="output-block">
    <div class="output-header">
      <div class="output-title">
        <div class="vertex-badge v2">2</div>
        <span class="output-name v2-text">Second Vertex</span>
        <span class="output-meta" id="meta-v2"></span>
      </div>
      <div class="output-actions">
        <button class="btn btn-copy v2" onclick="copyOutput('out-v2', this)" style="border-color:var(--accent2);color:var(--accent2)">Copy</button>
      </div>
    </div>
    <textarea class="output-area" id="out-v2" readonly style="color:#ffb3c1"></textarea>
  </div>

  <!-- V3 -->
  <div class="output-block">
    <div class="output-header">
      <div class="output-title">
        <div class="vertex-badge v3">3</div>
        <span class="output-name v3-text">Third Vertex</span>
        <span class="output-meta" id="meta-v3"></span>
      </div>
      <div class="output-actions">
        <button class="btn btn-copy" onclick="copyOutput('out-v3', this)" style="border-color:var(--accent3);color:var(--accent3)">Copy</button>
      </div>
    </div>
    <textarea class="output-area" id="out-v3" readonly style="color:#c4baff"></textarea>
  </div>
</div>

<script>
  const dropzone = document.getElementById('dropzone');
  const fileInput = document.getElementById('file-input');

  dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('dragover'); });
  dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
  dropzone.addEventListener('drop', e => {
    e.preventDefault();
    dropzone.classList.remove('dragover');
    const file = e.dataTransfer.files[0];
    if (file) processFile(file);
  });
  fileInput.addEventListener('change', e => {
    if (e.target.files[0]) processFile(e.target.files[0]);
  });

  function showError(msg) {
    const el = document.getElementById('error-msg');
    el.textContent = '⚠ ' + msg;
    el.classList.add('visible');
    document.getElementById('output-sections').classList.remove('visible');
    document.getElementById('stats-bar').classList.remove('visible');
  }

  function clearError() {
    document.getElementById('error-msg').classList.remove('visible');
  }

  function processFile(file) {
    clearError();
    if (!file.name.toLowerCase().endsWith('.obj')) {
      showError('Please provide a .obj file.');
      return;
    }
    const reader = new FileReader();
    reader.onload = e => parseOBJ(e.target.result, file.name);
    reader.readAsText(file);
  }

  function fmt(n) {
    // Format number: remove trailing zeros but keep enough precision
    return parseFloat(n.toFixed(6)).toString();
  }

  function parseOBJ(text, filename) {
    const lines = text.split(/\r?\n/);
    const verts = []; // 0-indexed internally
    const triangles = []; // each: [i0, i1, i2] (0-indexed)

    for (const raw of lines) {
      const line = raw.trim();
      if (!line || line.startsWith('#')) continue;

      const parts = line.split(/\s+/);
      const cmd = parts[0];

      if (cmd === 'v') {
        const x = parseFloat(parts[1]);
        const y = parseFloat(parts[2]);
        const z = parseFloat(parts[3]);
        if (isNaN(x) || isNaN(y) || isNaN(z)) continue;
        verts.push([x, y, z]);
      }

      if (cmd === 'f') {
        // Face indices can be: v, v/vt, v/vt/vn, v//vn — extract vertex index only
        const indices = [];
        for (let i = 1; i < parts.length; i++) {
          const idx = parseInt(parts[i].split('/')[0]);
          if (isNaN(idx)) continue;
          // OBJ is 1-indexed; negative = relative
          const resolved = idx > 0 ? idx - 1 : verts.length + idx;
          indices.push(resolved);
        }
        // Fan-triangulate polygon
        for (let i = 1; i < indices.length - 1; i++) {
          triangles.push([indices[0], indices[i], indices[i + 1]]);
        }
      }
    }

    if (verts.length === 0) { showError('No vertices (v) found in this OBJ file.'); return; }
    if (triangles.length === 0) { showError('No faces (f) found in this OBJ file.'); return; }

    // Validate indices
    for (const [a, b, c] of triangles) {
      if (a < 0 || a >= verts.length || b < 0 || b >= verts.length || c < 0 || c >= verts.length) {
        showError('Face index out of range — the OBJ may be malformed.');
        return;
      }
    }

    // Build arrays
    const v1 = [], v2 = [], v3 = [];
    for (const [a, b, c] of triangles) {
      const pa = verts[a], pb = verts[b], pc = verts[c];
      v1.push(`(${fmt(pa[0])},${fmt(pa[1])},${fmt(pa[2])})`);
      v2.push(`(${fmt(pb[0])},${fmt(pb[1])},${fmt(pb[2])})`);
      v3.push(`(${fmt(pc[0])},${fmt(pc[1])},${fmt(pc[2])})`);
    }

    const fmt1 = '[' + v1.join(',') + ']';
    const fmt2 = '[' + v2.join(',') + ']';
    const fmt3 = '[' + v3.join(',') + ']';

    document.getElementById('out-v1').value = fmt1;
    document.getElementById('out-v2').value = fmt2;
    document.getElementById('out-v3').value = fmt3;

    const metaText = `${triangles.length} entries`;
    document.getElementById('meta-v1').textContent = metaText;
    document.getElementById('meta-v2').textContent = metaText;
    document.getElementById('meta-v3').textContent = metaText;

    document.getElementById('stat-verts').textContent = verts.length.toLocaleString();
    document.getElementById('stat-faces').textContent = (triangles.length).toLocaleString();
    document.getElementById('stat-tris').textContent = triangles.length.toLocaleString();

    document.getElementById('stats-bar').classList.add('visible');
    document.getElementById('output-sections').classList.add('visible');

    // Update drop zone to show filename
    const existingTag = dropzone.querySelector('.file-name-tag');
    if (existingTag) existingTag.remove();
    const tag = document.createElement('span');
    tag.className = 'file-name-tag';
    tag.textContent = filename;
    dropzone.querySelector('.drop-main').appendChild(tag);
  }

  function copyOutput(id, btn) {
    const val = document.getElementById(id).value;
    navigator.clipboard.writeText(val).then(() => {
      const orig = btn.textContent;
      btn.textContent = 'Copied!';
      btn.classList.add('copied');
      setTimeout(() => { btn.textContent = orig; btn.classList.remove('copied'); }, 1800);
    });
  }
</script>
</body>
</html>
