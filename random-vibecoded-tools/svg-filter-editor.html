<title>SVG Filter Nodes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: full-height split. Node canvas left, draggable splitter, resizable image preview right (stacked on phones). */
:root{
  --bg:#e6e8ec; --canvas:#dde0e5; --dot:#c3c8d0; --panel:#f5f6f8; --node:#fcfcfd; --field:#eef0f3;
  --line:#c5cad2; --fg:#1b2027; --muted:#5d6672; --accent:#2a68d6; --accent-fg:#fff;
  --sock:#c9a227; --wire:#7d8794; --warn:#a85b00; --ok:#1f7a4d; --shadow:0 4px 14px rgba(20,28,40,.18);
  --c-src:#a8485c; --c-color:#3f78c0; --c-combine:#7a5bb8; --c-shape:#2f8f7a; --c-gen:#a8741f; --c-light:#857619; --c-out:#4c5764;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace; --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --check1:#d8dbe0; --check2:#eceef1;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14171b; --canvas:#1a1e23; --dot:#2c333b; --panel:#21262c; --node:#292f37; --field:#1d2228;
  --line:#3a424c; --fg:#e3e7ec; --muted:#8e98a5; --accent:#5b9cff; --accent-fg:#0b1220;
  --sock:#d8b640; --wire:#7f8a98; --warn:#e0a24a; --ok:#58c48e; --shadow:0 6px 18px rgba(0,0,0,.45);
  --check1:#2a2f36; --check2:#333940; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14171b; --canvas:#1a1e23; --dot:#2c333b; --panel:#21262c; --node:#292f37; --field:#1d2228;
  --line:#3a424c; --fg:#e3e7ec; --muted:#8e98a5; --accent:#5b9cff; --accent-fg:#0b1220;
  --sock:#d8b640; --wire:#7f8a98; --warn:#e0a24a; --ok:#58c48e; --shadow:0 6px 18px rgba(0,0,0,.45);
  --check1:#2a2f36; --check2:#333940; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:13px/1.4 var(--sans);display:flex;
  padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow:hidden}
button,input,select{font:inherit;color:inherit}
.app{--pw:42%;--ph:46%;display:flex;flex:1;min-width:0;min-height:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.editor{flex:1;min-width:0;position:relative}
.view{position:absolute;inset:0;overflow:hidden;background-color:var(--canvas);
  background-image:radial-gradient(circle,var(--dot) 1.2px,transparent 1.4px);background-size:24px 24px;touch-action:none;outline:none;cursor:default}
.view.panning{cursor:grabbing}
.world{position:absolute;left:0;top:0;transform-origin:0 0}
.wires{position:absolute;left:0;top:0;overflow:visible;pointer-events:none;width:1px;height:1px}
.wire{fill:none;stroke:var(--wire);stroke-width:2.2}
.wire.sel{stroke:var(--accent);stroke-width:3}
.wire.tmp{stroke:var(--accent);stroke-dasharray:5 4}
.wirehit{fill:none;stroke:transparent;stroke-width:14;pointer-events:stroke;cursor:pointer}
.wirehit:hover+.wire,.wire.hov{stroke:var(--accent)}
#nodes{position:absolute;left:0;top:0}
.node{position:absolute;width:236px;background:var(--node);border:1px solid var(--line);border-radius:7px;box-shadow:var(--shadow);user-select:none}
.node.selected{outline:2px solid var(--accent);outline-offset:1px}
.nh{display:flex;align-items:center;gap:2px;padding:5px 5px 5px 9px;border-radius:6px 6px 0 0;background:var(--cat);color:#fff;cursor:grab;font-weight:600;font-size:12px}
.node.collapsed .nh{border-radius:6px 6px 0 0}
.nt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--mono);font-weight:500}
.ib{all:unset;display:grid;place-items:center;width:22px;height:22px;border-radius:4px;cursor:pointer;color:#fff;opacity:.85}
.ib:hover{background:rgba(255,255,255,.22);opacity:1}
.ib:focus-visible{outline:2px solid #fff}
.ib.on{background:#fff;color:var(--cat);opacity:1}
.ib svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nrow{position:relative;display:flex;align-items:center;gap:6px;min-height:26px;padding:3px 14px}
.nrow.out{justify-content:space-between;border-bottom:1px solid var(--line)}
.rlab{color:var(--muted);font-size:11px}
.rname{width:118px;text-align:right;font-family:var(--mono);font-size:12px;background:transparent;border:1px solid transparent;border-radius:3px;padding:1px 4px;color:var(--fg)}
.rname:hover{border-color:var(--line)}
.rname:focus{border-color:var(--accent);outline:none;background:var(--field)}
.rname[readonly]{cursor:default;border-color:transparent!important;background:transparent!important}
.pl{font-family:var(--mono);font-size:12px}
.chip{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--accent);background:var(--field);border-radius:10px;padding:0 7px;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.dim{color:var(--muted);font-style:italic}
.sock{position:absolute;top:50%;width:13px;height:13px;margin-top:-6.5px;border-radius:50%;background:var(--sock);border:2px solid var(--node);box-shadow:0 0 0 1px var(--line);cursor:crosshair;touch-action:none}
.sock.in{left:-7px}.sock.out{right:-7px}
.sock:hover,.sock.hot{transform:scale(1.35);box-shadow:0 0 0 2px var(--accent)}
.sock.can{box-shadow:0 0 0 2px var(--accent)}
.node.isolated{box-shadow:0 0 0 2px var(--accent),var(--shadow)}
.np{padding:6px 10px 9px;display:flex;flex-direction:column;gap:5px;border-top:1px solid var(--line)}
.node.collapsed .np{display:none}
.fr{display:grid;grid-template-columns:78px 1fr;align-items:center;gap:6px}
.fl{color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fl.scrub{cursor:ew-resize}
.fg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;min-width:0}
.fx{width:100%;min-width:0;background:var(--field);border:1px solid var(--line);border-radius:3px;padding:2px 5px;font-family:var(--mono);font-size:12px;height:24px}
.fx:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
input[type=number]::-webkit-inner-spin-button{display:none}
input[type=color].fx{padding:1px 2px;cursor:pointer}
.gh{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-top:3px;font-family:var(--mono)}
details.rg{border-top:1px dashed var(--line);padding-top:5px;margin-top:2px}
details.rg summary{cursor:pointer;color:var(--muted);font-size:11.5px;list-style:none;display:flex;align-items:center;gap:5px}
details.rg summary::-webkit-details-marker{display:none}
details.rg summary::before{content:"▸";font-size:10px;transition:transform .12s}
details.rg[open] summary::before{transform:rotate(90deg)}
details.rg .body{display:flex;flex-direction:column;gap:5px;margin-top:6px}
.mx{display:grid;grid-template-columns:repeat(5,1fr);gap:3px}
.mx .fx{padding:2px 2px;text-align:center;font-size:11px;height:22px}
.minibtn{background:var(--field);border:1px solid var(--line);border-radius:3px;height:24px;cursor:pointer;padding:0 8px}
.minibtn:hover{border-color:var(--accent)}
.note{font-size:11px;color:var(--muted);line-height:1.35}
.tools{position:absolute;left:10px;top:10px;display:flex;gap:6px;flex-wrap:wrap;max-width:calc(100% - 20px);align-items:center}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:5px;height:28px;padding:0 10px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn:disabled{opacity:.4;cursor:default}
.btn:focus-visible,.minibtn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:600}
.btn svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.iso{display:none;background:var(--accent);color:var(--accent-fg);border-radius:5px;height:28px;padding:0 4px 0 10px;align-items:center;gap:6px;font-family:var(--mono);font-size:12px}
.iso.show{display:inline-flex}
.iso button{all:unset;cursor:pointer;width:20px;height:20px;display:grid;place-items:center;border-radius:3px}
.iso button:hover{background:rgba(0,0,0,.18)}
.hint{position:absolute;left:12px;bottom:10px;right:12px;color:var(--muted);font-size:11.5px;pointer-events:none}
.box{position:absolute;border:1px solid var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent);pointer-events:none}
.split{flex:0 0 7px;background:var(--line);cursor:col-resize;position:relative;touch-action:none}
.split::after{content:"";position:absolute;inset:50% 2px auto 2px;height:36px;margin-top:-18px;border-radius:2px;background:var(--muted);opacity:.5}
.split:hover,.split.drag,.split:focus-visible{background:var(--accent);outline:none}
.preview{flex:0 0 var(--pw);min-width:240px;max-width:80%;display:flex;flex-direction:column;min-height:0;background:var(--panel)}
.ph{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line)}
.ph h2{font-size:12px;letter-spacing:.07em;text-transform:uppercase;margin:0 auto 0 0;font-family:var(--mono);font-weight:500}
.ph select{height:28px;background:var(--field);border:1px solid var(--line);border-radius:5px;padding:0 6px}
.ph label{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);cursor:pointer}
.stage{flex:1;min-height:120px;overflow:auto;padding:12px;position:relative;background:var(--canvas)}
.frame{position:relative;resize:both;overflow:hidden;min-width:120px;min-height:100px;border:1px solid var(--line);border-radius:4px;background-color:var(--check1);
  background-image:linear-gradient(45deg,var(--check2) 25%,transparent 25%,transparent 75%,var(--check2) 75%),linear-gradient(45deg,var(--check2) 25%,transparent 25%,transparent 75%,var(--check2) 75%);background-size:16px 16px;background-position:0 0,8px 8px}
.frame.bg-dark{background:#0d0f12}.frame.bg-light{background:#fafafa}
.frame svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.drop{position:absolute;inset:6px;border:2px dashed var(--accent);border-radius:8px;background:color-mix(in srgb,var(--accent) 12%,var(--panel));display:none;place-items:center;font-weight:600;z-index:5;pointer-events:none}
.preview.dragover .drop{display:grid}
.meta{padding:6px 10px;font-size:11.5px;color:var(--muted);border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
.warn{color:var(--warn)}
.code{border-top:1px solid var(--line);max-height:36%;display:flex;flex-direction:column;min-height:0}
.code summary{cursor:pointer;padding:6px 10px;display:flex;align-items:center;gap:8px;font-size:12px;list-style:none}
.code summary::-webkit-details-marker{display:none}
.code summary::before{content:"▸";font-size:10px}
.code[open] summary::before{content:"▾"}
.code pre{margin:0;padding:8px 10px;overflow:auto;font:11.5px/1.5 var(--mono);background:var(--field);border-top:1px solid var(--line);flex:1;min-height:0;tab-size:2;user-select:text}
.menu{position:fixed;z-index:50;width:260px;max-height:min(420px,70vh);display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);overflow:hidden}
.menu[hidden]{display:none}
.menu input{border:0;border-bottom:1px solid var(--line);background:var(--field);padding:8px 10px;outline:none}
.menu ul{list-style:none;margin:0;padding:4px;overflow:auto}
.menu li.cat{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:6px 8px 2px;font-family:var(--mono)}
.menu li.it{padding:5px 8px;border-radius:4px;cursor:pointer;display:flex;gap:8px;align-items:center;font-family:var(--mono);font-size:12px}
.menu li.it i{width:9px;height:9px;border-radius:50%;background:var(--cat);flex:none}
.menu li.it.on,.menu li.it:hover{background:var(--accent);color:var(--accent-fg)}
.cat-src{--cat:var(--c-src)}.cat-color{--cat:var(--c-color)}.cat-combine{--cat:var(--c-combine)}.cat-shape{--cat:var(--c-shape)}.cat-gen{--cat:var(--c-gen)}.cat-light{--cat:var(--c-light)}.cat-out{--cat:var(--c-out)}
@media (max-width:760px){
  .app{flex-direction:column}
  .preview{flex:0 0 var(--ph);min-width:0;max-width:none;width:100%}
  .split{flex-basis:8px;cursor:row-resize}.split::after{inset:2px 50% 2px auto;width:36px;height:auto;margin:0 -18px 0 0}
  .hint{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app" id="app">
  <section class="editor">
    <div id="view" class="view" tabindex="0" aria-label="Node graph canvas">
      <div id="world" class="world">
        <svg id="wires" class="wires" aria-hidden="true"></svg>
        <div id="nodes"></div>
      </div>
      <div class="tools">
        <button class="btn pri" id="bAdd" title="Add node (Shift+A or right-click)"><svg viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></svg>Add</button>
        <button class="btn" id="bUndo" title="Undo (Ctrl+Z)" aria-label="Undo"><svg viewBox="0 0 16 16"><path d="M6 3 2.5 6.5 6 10M3 6.5h6.5a4 4 0 0 1 0 8H7"/></svg></button>
        <button class="btn" id="bRedo" title="Redo (Ctrl+Shift+Z)" aria-label="Redo"><svg viewBox="0 0 16 16"><path d="M10 3l3.5 3.5L10 10M13 6.5H6.5a4 4 0 0 0 0 8H9"/></svg></button>
        <button class="btn" id="bFit" title="Frame all nodes (Home)">Fit</button>
        <button class="btn" id="bLayout" title="Arrange nodes left to right">Arrange</button>
        <button class="btn" id="bReset" title="Restore the example graph">Reset</button>
        <span class="iso" id="iso"><span id="isoName"></span><button id="isoOff" title="Stop isolating" aria-label="Stop isolating"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M2 2l8 8M10 2l-8 8"/></svg></button></span>
      </div>
      <div class="hint">Drag output to input to connect · drag from a connected input to pull the wire off · eye button isolates a node's output · Shift+A add · Del removes · wheel zooms</div>
      <div id="box" class="box" hidden></div>
    </div>
  </section>
  <div class="split" id="split" role="separator" aria-orientation="vertical" aria-label="Resize preview" tabindex="0"></div>
  <aside class="preview" id="preview">
    <div class="ph">
      <h2>Preview</h2>
      <button class="btn" id="bUp"><svg viewBox="0 0 16 16"><path d="M8 11V3M4.5 6.5 8 3l3.5 3.5M3 13h10"/></svg>Upload</button>
      <input type="file" id="file" accept="image/*" hidden>
      <select id="sample" aria-label="Sample image"><option value="sunset">Sample: Sunset</option><option value="chart">Sample: Color chart</option></select>
      <select id="bgsel" aria-label="Preview background"><option value="">Checker</option><option value="bg-dark">Dark</option><option value="bg-light">Light</option></select>
      <label><input type="checkbox" id="orig"> Original</label>
      <button class="btn" id="bFrame" title="Fit the preview frame to this panel">Fit frame</button>
    </div>
    <div class="stage" id="stage">
      <div class="frame" id="frame" title="Drag the corner to resize">
        <svg id="psvg" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" style="overflow:visible">
          <defs><filter id="fx"></filter></defs>
          <rect id="pbox" fill="none" stroke="currentColor" stroke-opacity=".25" stroke-dasharray="4 4"></rect>
          <image id="pimg" filter="url(#fx)"></image>
        </svg>
      </div>
    </div>
    <div class="drop">Drop an image to preview</div>
    <div class="meta"><span id="imgInfo"></span><span class="warn" id="warn"></span></div>
    <details class="code" id="codeBox" open>
      <summary>SVG code <button class="minibtn" id="bCopy" type="button">Copy</button></summary>
      <pre id="code"></pre>
    </details>
  </aside>
</div>

  const out=S.nodes.find(n=>n.type==='output');depth[out.id]=Math.max(0,...Object.values(depth).filter((_,i,a)=>true))+ (Object.values(depth).some(v=>v>=0)?0:0);
  const maxD=Math.max(...S.nodes.filter(n=>n!==out).map(n=>depth[n.id]),0);depth[out.id]=maxD+1;
  const cols={};S.nodes.forEach(n=>(cols[depth[n.id]]=cols[depth[n.id]]||[]).push(n));
  for(const d in cols){let y=40;cols[d].sort((a,b)=>a.y-b.y).forEach(n=>{n.x=40+d*290;n.y=y;y+=els[n.id].offsetHeight+28})}
  S.nodes.forEach(n=>{els[n.id].style.left=n.x+'px';els[n.id].style.top=n.y+'px'});
  requestAnimationFrame(()=>{drawWires();fit()});commit()}
function duplicate(){
  const ids=[...S.sel].filter(i=>byId(i).type!=='output');if(!ids.length)return;const map={};
  for(const id of ids){const o=byId(id),n=newNode(o.type,o.x+30,o.y+30);n.params=JSON.parse(JSON.stringify(o.params));n.ui={};map[id]=n.id;S.nodes.push(n)}
  for(const l of [...S.links])if(map[l.to]&&map[l.from])S.links.push({id:'l'+uid(),from:map[l.from],to:map[l.to],port:l.port});
  fullRender();select(Object.values(map));update();commit()}
function deleteSel(){
  if(S.selLink){S.links=S.links.filter(l=>l.id!==S.selLink);S.selLink=null}
  else [...S.sel].forEach(removeNode);
  fullRender();update();commit()}
$('#bUndo').onclick=undo;$('#bRedo').onclick=redo;$('#bFit').onclick=fit;$('#bLayout').onclick=arrange;
$('#bReset').onclick=()=>{initDefault();};
$('#isoOff').onclick=()=>{S.isolate=null;markIso();update();commit()};
addEventListener('keydown',e=>{
  const tag=(e.target.tagName||'').toLowerCase();if(tag==='input'||tag==='select'||tag==='textarea')return;
  const mod=e.ctrlKey||e.metaKey;
  if(mod&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo()}
  else if(mod&&e.key.toLowerCase()==='y'){e.preventDefault();redo()}
  else if(mod&&e.key.toLowerCase()==='d'){e.preventDefault();duplicate()}
  else if(e.key==='Delete'||e.key==='Backspace'||e.key.toLowerCase()==='x'&&!mod){if(S.sel.size||S.selLink){e.preventDefault();deleteSel()}}
  else if(e.key==='A'&&e.shiftKey||(e.key==='a'&&e.shiftKey)){e.preventDefault();const r=view.getBoundingClientRect(),w=toWorld(r.left+r.width/2-100,r.top+r.height/2-60);openMenu(r.left+r.width/2-130,r.top+80,w.x,w.y,null)}
  else if(e.key==='Home'||e.key.toLowerCase()==='f'&&!mod){fit()}
  else if(e.key.toLowerCase()==='i'&&!mod&&S.sel.size===1){const id=[...S.sel][0];if(byId(id).type!=='output')toggleIsolate(id)}});
new ResizeObserver(()=>drawWires()).observe(view);

/* ---------- initial graph ---------- */
function initDefault(){
  S.nodes=[];S.links=[];S.isolate=null;S.counters={};S.sel=new Set();S.selLink=null;
  const mk=(t,x,y,p)=>{const n=newNode(t,x,y);Object.assign(n.params,p||{});S.nodes.push(n);return n};
  const g=mk('SourceGraphic',40,40),a=mk('SourceAlpha',40,170);
  const b=mk('feGaussianBlur',320,150,{stdDeviation:'6'}),o=mk('feOffset',590,150,{dx:'10',dy:'14'});
  const f=mk('feFlood',590,330,{'flood-color':'#1e2a6b','flood-opacity':'0.65'}),c=mk('feComposite',860,200,{operator:'in'});
  const m=mk('feMerge',1130,150),out=mk('output',1400,170);
  connect(a.id,b.id,'in');connect(b.id,o.id,'in');connect(f.id,c.id,'in');connect(o.id,c.id,'in2');
  connect(c.id,m.id,'m0');connect(g.id,m.id,'m1');connect(m.id,out.id,'in');
  hist=[];hi=-1;S.view={x:20,y:60,k:1};fullRender();update();commit();requestAnimationFrame(fit)}
loadSample('sunset');
let loaded=false;
try{const s=localStorage.getItem(KEY);if(s){const o=JSON.parse(s);
  if(o.nodes&&o.nodes.every(n=>T[n.type])&&o.nodes.some(n=>n.type==='output')){S.nodes=o.nodes;S.links=o.links||[];S.isolate=o.isolate||null;S.counters=o.counters||{};
    S.nodes.forEach(n=>n.ui=n.ui||{});hist=[];hi=-1;fullRender();update();commit();requestAnimationFrame(fit);loaded=true}}}catch(e){}
if(!loaded)initDefault();
</script>
