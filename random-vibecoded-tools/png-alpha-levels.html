<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PNG Alpha Levels Tool</title>

<style>
body {
    font-family: sans-serif;
    padding: 20px;
}

.controls {
    margin: 10px 0;
}

label {
    display: inline-block;
    width: 180px;
}

#previewContainer {
    width: 500px;
    height: 500px;
    border: 1px solid black;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: white;
}

canvas {
    max-width: 100%;
    max-height: 100%;
}
</style>
</head>
<body>

<h2>PNG Alpha Levels Tool</h2>

<div class="controls">
    <input type="file" id="fileInput" accept="image/png">
</div>

<div class="controls">
    <label>
        Alpha Black Point:
        <span id="blackPointValue">0</span>%
    </label>
    <input
        type="range"
        id="blackPointSlider"
        min="-100"
        max="100"
        step="1"
        value="0"
    >
</div>

<div class="controls">
    <label>
        Alpha White Point:
        <span id="whitePointValue">50</span>%
    </label>
    <input
        type="range"
        id="whitePointSlider"
        min="0"
        max="100"
        step="1"
        value="50"
    >
</div>

<div class="controls">
    <button id="toggleBgBtn">Background: White</button>
    <button id="downloadBtn">Download PNG</button>
</div>

<div id="previewContainer">
    <canvas id="canvas"></canvas>
</div>

<script>
const fileInput = document.getElementById("fileInput");

const blackSlider = document.getElementById("blackPointSlider");
const whiteSlider = document.getElementById("whitePointSlider");

const blackPointValue = document.getElementById("blackPointValue");
const whitePointValue = document.getElementById("whitePointValue");

const toggleBgBtn = document.getElementById("toggleBgBtn");
const downloadBtn = document.getElementById("downloadBtn");

const previewContainer = document.getElementById("previewContainer");

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let originalImage = null;
let bgWhite = true;

fileInput.addEventListener("change", e => {
    const file = e.target.files[0];
    if (!file) return;

    const img = new Image();

    img.onload = () => {
        originalImage = img;
        processImage();
    };

    img.src = URL.createObjectURL(file);
});

blackSlider.addEventListener("input", () => {
    blackPointValue.textContent = blackSlider.value;
    processImage();
});

whiteSlider.addEventListener("input", () => {
    whitePointValue.textContent = whiteSlider.value;
    processImage();
});

toggleBgBtn.addEventListener("click", () => {
    bgWhite = !bgWhite;

    if (bgWhite) {
        previewContainer.style.background = "white";
        toggleBgBtn.textContent = "Background: White";
    } else {
        previewContainer.style.background = "black";
        toggleBgBtn.textContent = "Background: Black";
    }
});

function processImage() {
    if (!originalImage) return;

    canvas.width = originalImage.width;
    canvas.height = originalImage.height;

    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(originalImage, 0, 0);

    const imageData = ctx.getImageData(
        0,
        0,
        canvas.width,
        canvas.height
    );

    const data = imageData.data;

    const blackPoint = Number(blackSlider.value) / 100;
    const whitePoint = Number(whiteSlider.value) / 100;

    for (let i = 0; i < data.length; i += 4) {

        const oldAlpha = data[i + 3] / 255;

        let newAlpha;

        if (whitePoint === blackPoint) {
            newAlpha = oldAlpha >= whitePoint ? 1 : 0;
        } else {
            newAlpha =
                (oldAlpha - blackPoint) /
                (whitePoint - blackPoint);
        }

        if (newAlpha < 0) newAlpha = 0;
        if (newAlpha > 1) newAlpha = 1;

        data[i + 3] = Math.round(newAlpha * 255);
    }

    ctx.putImageData(imageData, 0, 0);
}

downloadBtn.addEventListener("click", () => {
    if (!originalImage) return;

    const a = document.createElement("a");
    a.download = "alpha-levels-adjusted.png";
    a.href = canvas.toDataURL("image/png");
    a.click();
});
</script>

</body>
</html>
