<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Color + Grayscale Alpha Combiner</title>
<style>
    body {
        font-family: Arial, sans-serif;
        max-width: 900px;
        margin: 20px auto;
        padding: 20px;
    }

    .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        margin-bottom: 20px;
    }

    .file-group {
        display: flex;
        flex-direction: column;
        gap: 6px;
    }

    button {
        padding: 10px 16px;
        cursor: pointer;
    }

    canvas {
        border: 1px solid #ccc;
        max-width: 100%;
        margin-top: 10px;
    }

    .status {
        margin-top: 10px;
        color: #444;
    }
</style>
</head>
<body>

<h1>Color + Alpha Image Combiner</h1>

<p>
Select a color image and a grayscale image of the same dimensions.
The grayscale image becomes the alpha channel:
</p>

<ul>
    <li>White = fully opaque (255 alpha)</li>
    <li>Black = fully transparent (0 alpha)</li>
    <li>Gray = partial transparency</li>
</ul>

<div class="controls">
    <div class="file-group">
        <label for="colorInput">Color Image</label>
        <input type="file" id="colorInput" accept="image/*">
    </div>

    <div class="file-group">
        <label for="alphaInput">Grayscale Alpha Image</label>
        <input type="file" id="alphaInput" accept="image/*">
    </div>
</div>

<button id="combineBtn">Combine Images</button>
<button id="downloadBtn" disabled>Download PNG</button>

<div class="status" id="status"></div>

<h2>Preview</h2>
<canvas id="canvas"></canvas>

<script>
const colorInput = document.getElementById('colorInput');
const alphaInput = document.getElementById('alphaInput');
const combineBtn = document.getElementById('combineBtn');
const downloadBtn = document.getElementById('downloadBtn');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const statusEl = document.getElementById('status');

function loadImage(file) {
    return new Promise((resolve, reject) => {
        if (!file) {
            reject(new Error("No file selected"));
            return;
        }

        const img = new Image();

        img.onload = () => {
            URL.revokeObjectURL(img.src);
            resolve(img);
        };

        img.onerror = () => reject(new Error("Failed to load image"));
        img.src = URL.createObjectURL(file);
    });
}

combineBtn.addEventListener('click', async () => {
    try {
        statusEl.textContent = "Loading images...";

        const colorFile = colorInput.files[0];
        const alphaFile = alphaInput.files[0];

        if (!colorFile || !alphaFile) {
            throw new Error("Please select both images.");
        }

        const [colorImg, alphaImg] = await Promise.all([
            loadImage(colorFile),
            loadImage(alphaFile)
        ]);

        if (
            colorImg.width !== alphaImg.width ||
            colorImg.height !== alphaImg.height
        ) {
            throw new Error(
                `Image sizes do not match.
Color: ${colorImg.width}×${colorImg.height}
Alpha: ${alphaImg.width}×${alphaImg.height}`
            );
        }

        const width = colorImg.width;
        const height = colorImg.height;

        canvas.width = width;
        canvas.height = height;

        const colorCanvas = document.createElement('canvas');
        colorCanvas.width = width;
        colorCanvas.height = height;
        const colorCtx = colorCanvas.getContext('2d');
        colorCtx.drawImage(colorImg, 0, 0);

        const alphaCanvas = document.createElement('canvas');
        alphaCanvas.width = width;
        alphaCanvas.height = height;
        const alphaCtx = alphaCanvas.getContext('2d');
        alphaCtx.drawImage(alphaImg, 0, 0);

        const colorData = colorCtx.getImageData(0, 0, width, height);
        const alphaData = alphaCtx.getImageData(0, 0, width, height);

        const outData = new ImageData(width, height);

        for (let i = 0; i < colorData.data.length; i += 4) {
            outData.data[i] = colorData.data[i];       // R
            outData.data[i + 1] = colorData.data[i+1]; // G
            outData.data[i + 2] = colorData.data[i+2]; // B

            // Use grayscale brightness as alpha.
            const r = alphaData.data[i];
            const g = alphaData.data[i + 1];
            const b = alphaData.data[i + 2];

            const alpha =
                Math.round((r + g + b) / 3);

            outData.data[i + 3] = alpha;
        }

        ctx.putImageData(outData, 0, 0);

        downloadBtn.disabled = false;
        statusEl.textContent =
            `Done. Output size: ${width} × ${height}`;
    } catch (err) {
        downloadBtn.disabled = true;
        statusEl.textContent = err.message;
    }
});

downloadBtn.addEventListener('click', () => {
    const link = document.createElement('a');
    link.download = 'combined.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
});
</script>

</body>
</html>
